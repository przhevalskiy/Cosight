# Render Blueprint — CoSight
# Connect https://github.com/przhevalskiy/Cosight and deploy from this file.

services:
  - type: web
    name: cosight-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: GA4_PROPERTY_ID
        sync: false
      - key: GSC_SITE_URL
        sync: false
      - key: EMMA_PUBLIC_KEY
        sync: false
      - key: EMMA_PRIVATE_KEY
        sync: false
      - key: EMMA_ACCOUNT_ID
        sync: false
      - key: SPROUT_API_TOKEN
        sync: false
      - key: SPROUT_CBS_GROUP_IDS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: MISTRAL_MODEL
        value: mistral-large-latest

  - type: web
    name: cosight-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
